version: '3'

services:
  mssql:
    build:
      context: "."
      args:
        - "MSSQL_IMAGE=${MSSQL_IMAGE:-mcr.microsoft.com/mssql/server:2025-latest}"

    restart: unless-stopped

    environment:
      - "ACCEPT_EULA=Y"
      - "SA_PASSWORD=yourStrong(!)Password"

    ports:
      - "1433:1433"
