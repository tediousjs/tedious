name: zizmor

on:
  push:
    branches: [ "master", "alpha", "beta", "*.x" ]

  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:
  zizmor:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      # Findings are uploaded to the repository's code scanning alerts. The
      # job itself only fails on internal errors, not on findings.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          # `.gitignore` ignores all dotfiles, so collecting from `.` (the
          # default) finds nothing. Point zizmor at `.github` directly.
          inputs: .github

  # Fails when .github/workflows/actions.lock is out of sync with the
  # workflows or a locked pin no longer verifies upstream.
  lockfile:
    name: Verify GitHub Actions lockfile
    runs-on: ubuntu-slim
    permissions:
      contents: read
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.1.0
        with:
          persist-credentials: false

      - name: Install gh-actions-lock
        run: gh extension install github/gh-actions-lock --pin v0.4.1

      - name: Verify lockfile
        run: gh actions-lock --verify
