name: zizmor

on:
  push:
    branches: [ "master", "alpha", "beta", "*.x" ]

  pull_request:
    branches: [ "**" ]

permissions: {}

jobs:
  zizmor:
    name: Analyze GitHub Actions workflows
    runs-on: ubuntu-latest
    permissions:
      security-events: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings are uploaded to the repository's code scanning alerts. The
      # job itself only fails on internal errors, not on findings.
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          # `.gitignore` ignores all dotfiles, so collecting from `.` (the
          # default) finds nothing. Point zizmor at `.github` directly.
          inputs: .github
