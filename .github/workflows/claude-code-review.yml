name: Claude Code Review

on:
  # Review once, when a PR is opened or leaves draft. Pushes do not trigger a
  # new review; ask for one with an `@claude` comment (see claude.yml).
  pull_request:
    types: [opened, reopened, ready_for_review]

concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    if: github.event.pull_request.draft == false && github.event.pull_request.user.type != 'Bot'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}
            HEAD SHA: ${{ github.event.pull_request.head.sha }}

            Review this pull request for defects only: bugs, incorrect
            protocol handling, resource leaks, race conditions, security
            problems, and missing tests for behavior the PR changes.

            Rules:
            - Report only issues you are confident are real and that the
              author should act on. Skip style, naming, and nitpicks, and
              anything lint or CI already checks.
            - No praise, no summary of the PR, no list of files you read.
            - For each issue: `path:line`, what goes wrong and when, and a
              suggested fix. Keep each issue to a few sentences.
            - If you find no issues, do not post anything.

            If you do find issues, post them as a single comment with
            `gh pr comment`, starting with the line
            `Claude review of <short HEAD SHA>`.

          # See https://github.com/anthropics/claude-code-action/blob/main/docs/usage.md
          # or https://code.claude.com/docs/en/cli-reference for available options
          claude_args: '--model claude-opus-5-5 --allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'

