name: "Lint Pull Request Title"

on:
  # `pull_request` also runs for pull requests from forks. Those runs get a
  # read-only `GITHUB_TOKEN`, which is all this check needs: the action only
  # reads the pull request (to get its current title) and writes nothing.
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize

concurrency:
  # A newer event for the same pull request supersedes the older check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  main:
    name: Lint Pull Request Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
