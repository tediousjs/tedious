name: "Lint Pull Request Title"

on:
  # `pull_request_target` is needed so the check also runs for pull requests
  # from forks. It is safe here because the job never checks out or runs code
  # from the pull request; it only reads the pull request title.
  pull_request_target: # zizmor: ignore[dangerous-triggers]
    types:
      - opened
      - edited
      - synchronize

concurrency:
  # A newer event for the same pull request supersedes the older check.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions: {}

jobs:
  main:
    name: Lint Pull Request Title
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    steps:
      - uses: amannn/action-semantic-pull-request@v6.1.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
