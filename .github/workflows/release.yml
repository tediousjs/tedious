name: Release

on:
  schedule:
    - cron: '0 12 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Release
    # `workflow_dispatch` lets the job be started from any branch in the UI,
    # but dist-tags must only ever be moved from `master`.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # to move dist-tags via npm trusted publishing (OIDC)

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Use Node.js 22
      uses: actions/setup-node@v7.1.0
      with:
        node-version: "22"
        cache: 'npm'

    # Moving dist-tags via OIDC requires npm 11.21.0 or newer, which is newer
    # than the npm version bundled with Node.js 22. Install the npm version
    # locked in `package-lock.json` (also used by semantic-release) instead.
    - run: npm ci

    - name: Verify the integrity of provenance attestations and registry signatures for installed dependencies
      run: npm audit signatures

    - name: Tag latest release
      run: |
        info=$(npm info tedious --json)
        # npm 12+ always wraps `npm info --json` output in an array, older
        # versions return a bare object. Normalize to the object form.
        info=$(jq 'if type == "array" then .[0] else . end' <<< "$info")
        next=$(jq -r '."dist-tags".next' <<< "$info")
        latest=$(jq -r '."dist-tags".latest' <<< "$info")

        # Only promote when `next` is strictly newer than the current `latest`.
        if [ "$(printf '%s\n' "$latest" "$next" | sort -V | tail -n 1)" != "$latest" ]; then
          date_format="%Y-%m-%dT%H:%M:%SZ"

          publish_date=$(date -d "$(jq -r '.time["'"$next"'"]' <<< "$info")" +"$date_format")
          week_ago=$(date -d '-7 days' +"$date_format")

          # ...and only once it has soaked on `next` for at least a week.
          if [[ "$publish_date" < "$week_ago" || "$publish_date" == "$week_ago" ]]; then
            npx --no -- npm dist-tag add "tedious@$next" latest
          fi
        fi
