name: Azure SQL provisioning

# Creates and deletes the Azure SQL servers for `azure-sql.yml` runs,
# including runs from forks. See that file and `.github/AZURE_SQL_CI.md`.
#
# This workflow runs from the default branch and only runs code from it
# (the checkout below has no `ref`). It never checks out or runs code from
# the pull request. What it reads from the test run (request artifacts, job
# names) is validated as untrusted input by `provision.sh`.

on:
  # `requested`: when a test run is created, before its jobs have runners,
  # so that the servers are being created while the test jobs queue.
  # `in_progress`: for the attempts `requested` misses (see the `provision`
  # job's condition). GitHub only reports a run as in progress once all of
  # its jobs have started, so this can come late.
  # `completed`: teardown, whatever the test run's conclusion.
  workflow_run: # zizmor: ignore[dangerous-triggers]
    workflows: [ "Azure SQL" ]
    types: [ requested, in_progress, completed ]

concurrency:
  # Runs for the same test run attempt run one at a time: a second
  # provisioning run sees the first one's credentials and skips, and the
  # teardown waits for provisioning to finish.
  group: ${{ github.workflow }}-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}
  cancel-in-progress: false

permissions: {}

env:
  TEST_RUN_ID: ${{ github.event.workflow_run.id }}
  TEST_RUN_ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
  AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  AZURE_RESOURCE_GROUP: ${{ vars.AZURE_SQL_RESOURCE_GROUP }}
  TEST_APP_CLIENT_ID: ${{ vars.AZURE_TEST_APP_CLIENT_ID }}

jobs:
  provision:
    name: Provision (${{ matrix.config }})
    # `requested` covers the first attempt of every run. It does not fire for
    # re-runs, and fork runs that need a maintainer's approval are skipped
    # on `requested` (provision.sh). `in_progress` covers both.
    if: >-
      github.event.workflow_run.path == '.github/workflows/azure-sql.yml' && (
        github.event.action == 'requested' || (
          github.event.action == 'in_progress' && (
            github.event.workflow_run.run_attempt > 1 ||
            github.event.workflow_run.head_repository.full_name != github.repository
          )
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: azure-sql

    permissions:
      actions: read # to read the test run's request artifacts and jobs
      id-token: write # to log in to Azure via OIDC

    strategy:
      fail-fast: false
      matrix:
        # Fixed here rather than read from the test run: at most one server
        # per config per test run attempt.
        config: [ "azure-default", "azure-ad-password", "azure-ad-sp-secret", "token-credential" ]

    env:
      CONFIG: ${{ matrix.config }}
      SERVER_NAME: tedious-ci-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ matrix.config }}
      TEST_RUN_URL: ${{ github.event.workflow_run.html_url }}
      AZURE_LOCATION: ${{ vars.AZURE_SQL_LOCATION || 'eastus2' }}
      AZURE_SQL_SERVICE_OBJECTIVE: ${{ vars.AZURE_SQL_SERVICE_OBJECTIVE || 'S0' }}
      AZURE_SQL_ADMIN_GROUP_NAME: ${{ vars.AZURE_SQL_ADMIN_GROUP_NAME }}
      AZURE_SQL_ADMIN_GROUP_ID: ${{ vars.AZURE_SQL_ADMIN_GROUP_ID }}

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Provision Azure SQL server
      id: provision
      env:
        GH_TOKEN: ${{ github.token }}
        OUT_DIR: ${{ runner.temp }}/azure-sql-credentials
      run: .github/scripts/azure-sql/provision.sh

    - name: Publish the credentials
      id: publish
      if: steps.provision.outputs.found == 'true'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: azure-sql-credentials-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ matrix.config }}
        path: ${{ runner.temp }}/azure-sql-credentials/credentials.json
        retention-days: 1
        if-no-files-found: error

    # Lets the test job fail right away instead of waiting until it times out.
    - name: Report the failure to the test job
      if: failure() && steps.provision.outputs.found == 'true' && steps.publish.outcome != 'success'
      env:
        OUT_DIR: ${{ runner.temp }}/azure-sql-credentials
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: |
        mkdir -p "$OUT_DIR"
        jq -n --arg url "$RUN_URL" '{error: "Provisioning the Azure SQL server failed, see \($url)"}' > "$OUT_DIR/credentials.json"

    - name: Publish the failure
      if: failure() && steps.provision.outputs.found == 'true' && steps.publish.outcome != 'success'
      uses: actions/upload-artifact@v7.0.2
      with:
        name: azure-sql-credentials-${{ github.event.workflow_run.id }}-${{ github.event.workflow_run.run_attempt }}-${{ matrix.config }}
        path: ${{ runner.temp }}/azure-sql-credentials/credentials.json
        retention-days: 1

  teardown:
    name: Tear down
    if: github.event.action == 'completed' && github.event.workflow_run.path == '.github/workflows/azure-sql.yml'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: azure-sql

    permissions:
      id-token: write # to log in to Azure via OIDC

    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false

    - name: Delete the test run's servers and client secrets
      run: .github/scripts/azure-sql/teardown.sh
