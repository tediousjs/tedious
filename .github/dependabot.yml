version: 2

updates:
  # Keep the commit SHAs that GitHub Actions are pinned to up to date.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    commit-message:
      # Pull request titles must follow Conventional Commits.
      prefix: "ci"
    groups:
      github-actions:
        patterns:
          - "*"
